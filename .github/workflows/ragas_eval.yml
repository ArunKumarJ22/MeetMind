
name: RAG Quality Evaluation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ragas-eval:
    name: Ragas quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-pipeline/requirements-ragas.txt

      - name: Install MeetMind package
        working-directory: ai-pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install evaluation dependencies
        working-directory: ai-pipeline
        run: |
          python -m pip install -r requirements-ragas.txt

      - name: Check dependency consistency
        working-directory: ai-pipeline
        run: |
          python -m pip check

      - name: Run RAGAS evaluation
        working-directory: ai-pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pytest evaluation/ragas_eval.py -v -s \
            --tb=short \
            --junit-xml=eval-results.xml

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-eval-results
          path: ai-pipeline/eval-results.xml
          retention-days: 30
