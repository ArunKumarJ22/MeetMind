name: RAG Quality Evaluation

# Runs on every PR to main and on every push to main.
# If faithfulness or answer_relevancy drops below threshold, the check fails
# and the merge is blocked.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ragas-eval:
    name: Ragas quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ai-pipeline/requirements.txt

      - name: Install ai-pipeline package and eval dependencies
        working-directory: ai-pipeline
        run: |
          pip install -e .
          pip install ragas pytest langchain-openai

      - name: Run Ragas evaluation
        working-directory: ai-pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          pytest evaluation/ragas_eval.py -v -s \
            --tb=short \
            --junit-xml=eval-results.xml

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        # always upload — even on failure, so you can read the scores
        if: always()
        with:
          name: ragas-eval-results
          path: ai-pipeline/eval-results.xml
          retention-days: 30
