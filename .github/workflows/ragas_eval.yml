
name: RAG Quality Evaluation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ragas-eval:
    name: RAGAS quality gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: ai-pipeline/requirements.txt

      - name: Verify Python
        run: |
          python --version
          python -c "import sys; print(sys.executable)"

      - name: Install dependencies
        working-directory: ai-pipeline
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements.txt

      - name: Verify dependencies
        working-directory: ai-pipeline
        run: |
          python -m pip show ragas
          python -m pip show langchain-community
          python -m pip show langchain-openai
          python -m pip check
          python -c "import ragas; print('RAGAS import successful')"
          python -c "from langchain_community.chat_models.vertexai import ChatVertexAI; print('VertexAI compatibility import successful')"

      - name: Run RAGAS evaluation
        working-directory: ai-pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python -m pytest evaluation/ragas_eval.py -v -s \
            --tb=short \
            --junit-xml=eval-results.xml

      - name: Upload evaluation results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ragas-eval-results
          path: ai-pipeline/eval-results.xml
          retention-days: 30
